name: Build Android AAB and upload mapping

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android-build:
    name: Build AAB + mapping
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mkdir -p latest
          mv cmdline-tools/* latest/
          yes | latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-37" "build-tools;36.0.0" "cmdline-tools;latest"
          yes | latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT

      - name: Run native Android tests
        working-directory: android-native
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build release AAB
        working-directory: android-native
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab

      - name: Upload mapping folder
        uses: actions/upload-artifact@v4
        with:
          name: mapping-file
          path: android-native/app/build/outputs/mapping/release
